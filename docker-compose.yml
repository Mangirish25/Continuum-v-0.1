version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: continuum_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: continuum_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    container_name: continuum_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: continuum_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - continuum_db_data:/app/storage
      - type: bind
        source: ./data
        target: /project/data
        read_only: true
        bind:
          create_host_path: false
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/storage/continuum.db
      - SYNC_DATABASE_URL=sqlite:////app/storage/continuum.db
      - PROJECT_ROOT=/project
      - LOCAL_DATA_ROOT=/project/data
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_URL=http://chromadb:8000
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: continuum_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    healthcheck:
      disable: true
    volumes:
      - continuum_db_data:/app/storage
      - type: bind
        source: ./data
        target: /project/data
        read_only: true
        bind:
          create_host_path: false
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/storage/continuum.db
      - SYNC_DATABASE_URL=sqlite:////app/storage/continuum.db
      - PROJECT_ROOT=/project
      - LOCAL_DATA_ROOT=/project/data
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_URL=http://chromadb:8000
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - backend
      - redis

volumes:
  continuum_db_data:
  chroma_data:
  ollama_data:
